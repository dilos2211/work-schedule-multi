<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Work Schedule Multi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- Верхнее меню вкладок -->
    <!-- ========================= -->
    <nav class="top-nav">
        <button class="tab-btn active" data-tab="calendar">📅 Kalendarz</button>
        <button class="tab-btn" data-tab="salary">💰 Wynagrodzenie</button>
        <button class="tab-btn" data-tab="settings">⚙️ Ustawienia</button>
    </nav>

    <!-- ========================= -->
    <!-- Контейнер вкладок -->
    <!-- ========================= -->
    <div class="tab-container">

        <!-- ========================= -->
        <!-- Вкладка: Календарь -->
        <!-- ========================= -->
        <section id="calendar" class="tab-content active">

            <h2 class="section-title">Kalendarz pracy</h2>

            <div class="calendar-controls">
                <label>
                    Rok:
                    <input type="number" id="year" value="2026">
                </label>

                <label>
                    Miesiąc:
                    <select id="month">
                        <option value="0">Styczeń</option>
                        <option value="1">Luty</option>
                        <option value="2">Marzec</option>
                        <option value="3">Kwiecień</option>
                        <option value="4">Maj</option>
                        <option value="5">Czerwiec</option>
                        <option value="6">Lipiec</option>
                        <option value="7">Sierpień</option>
                        <option value="8">Wrzesień</option>
                        <option value="9">Październik</option>
                        <option value="10">Listopad</option>
                        <option value="11">Grudzień</option>
                    </select>
                </label>

                <button id="load-schedule" class="gold-btn">Załaduj</button>
                <button id="save-schedule" class="gold-btn">Zapisz</button>
            </div>

            <div id="schedule-container" class="calendar-grid"></div>
        </section>

        <!-- ========================= -->
        <!-- Вкладка: Wynagrodzenie -->
        <!-- ========================= -->
        <section id="salary" class="tab-content">

            <h2 class="section-title">Wynagrodzenie</h2>

            <div class="salary-controls">
                <label>
                    Rok:
                    <input type="number" id="salary-year" value="2026">
                </label>

                <label>
                    Miesiąc:
                    <select id="salary-month">
                        <option value="0">Styczeń</option>
                        <option value="1">Luty</option>
                        <option value="2">Marzec</option>
                        <option value="3">Kwiecień</option>
                        <option value="4">Maj</option>
                        <option value="5">Czerwiec</option>
                        <option value="6">Lipiec</option>
                        <option value="7">Sierpień</option>
                        <option value="8">Wrzesień</option>
                        <option value="9">Październik</option>
                        <option value="10">Listopad</option>
                        <option value="11">Grudzień</option>
                    </select>
                </label>

                <button id="load-salary" class="gold-btn">Oblicz</button>
            </div>

            <div class="salary-results">
                <div class="result-card">
                    <h3>Brutto</h3>
                    <p id="salary-brutto">0 zł</p>
                </div>

                <div class="result-card">
                    <h3>Netto</h3>
                    <p id="salary-netto">0 zł</p>
                </div>

                <div class="result-card">
                    <h3>ZUS</h3>
                    <p id="salary-zus">0 zł</p>
                </div>

                <div class="result-card">
                    <h3>PIT</h3>
                    <p id="salary-pit">0 zł</p>
                </div>

                <div class="result-card">
                    <h3>Godziny</h3>
                    <p>Razem: <span id="salary-hours">0</span></p>
                    <p>50%: <span id="salary-hours50">0</span></p>
                    <p>100%: <span id="salary-hours100">0</span></p>
                </div>
            </div>
        </section>

        <!-- ========================= -->
        <!-- Вкладка: Ustawienia -->
        <!-- ========================= -->
        <section id="settings" class="tab-content">

            <h2 class="section-title">Ustawienia</h2>

            <div class="settings-grid">

                <label>
                    Typ wynagrodzenia:
                    <select id="calc-type">
                        <option value="monthly">Miesięczne</option>
                        <option value="hourly">Godzinowe</option>
                    </select>
                </label>

                <label>
                    Stawka miesięczna (brutto):
                    <input type="number" id="monthly-rate" value="5500">
                </label>

                <label>
                    Premia (brutto):
                    <input type="number" id="bonus" value="850">
                </label>

                <label>
                    Start 1 zmiany:
                    <input type="time" id="shift1-start" value="06:00">
                </label>

                <button id="save-settings" class="gold-btn">Zapisz ustawienia</button>
            </div>
        </section>

    </div>

    <!-- Скрипты -->
    <script src="app.js"></script>
    <script src="config.js"></script>
    <script src="schedule.js"></script>
    <script src="salary.js"></script>
    <script src="settings.js"></script>

</body>
</html>
